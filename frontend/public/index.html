        <style>
            html, body { margin: 0; padding: 0; background: #050914; color: #E2F1FF; font-family: 'JetBrains Mono', monospace; }
            #root { min-height: 100vh; }
            #sertex-boot {
                position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                flex-direction: column; gap: 12px; background: #050914; color: #00F0FF;
                font-family: monospace; z-index: 0;
            }
            #sertex-boot .title { letter-spacing: 0.3em; font-size: 18px; text-shadow: 0 0 12px rgba(0,240,255,0.6); }
            #sertex-boot .sub { font-size: 11px; opacity: 0.6; letter-spacing: 0.2em; }
            #sertex-boot .dot { width: 6px; height: 6px; border-radius: 50%; background: #00F0FF; box-shadow: 0 0 8px #00F0FF; animation: sertexPulse 1.2s infinite ease-in-out; }
            @keyframes sertexPulse { 0%,100% { opacity: 0.3; transform: scale(0.8);} 50% { opacity: 1; transform: scale(1.2);} }
            #sertex-error { display:none; position: fixed; inset: 0; align-items:center; justify-content:center; flex-direction:column; gap:12px; background:#050914; color:#FF5577; font-family: monospace; z-index:9999; padding: 20px; text-align:center; }
            #sertex-error.show { display:flex; }
            #sertex-error .code { color:#88a; font-size: 11px; opacity: 0.7; max-width: 640px; word-break: break-word; }
        </style>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>

        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root">
            <div id="sertex-boot">
                <img src="%PUBLIC_URL%/emblem-mark.png" alt="SERTEX" width="88" height="88" style="filter: drop-shadow(0 0 18px rgba(0,240,255,0.55)); margin-bottom: 4px;" />
                <div class="title">S.E.R.T.E.X</div>
                <div class="dot"></div>
                <div class="sub">BAĞLANIYOR...</div>
            </div>
        </div>
        <div id="sertex-error">
            <div style="font-size:16px; letter-spacing: 0.2em;">SERTEX · BAĞLANTI HATASI</div>
            <div style="font-size:12px; color:#E2F1FF;">Uygulama başlatılamadı. Sayfayı yenilemeyi deneyin (Ctrl+Shift+R).</div>
            <div class="code" id="sertex-error-msg"></div>
        </div>
        <script>
            // If the app hasn't mounted within 15 seconds, show error UI so user isn't stuck on white/blue screen.
            window.__sertexBootStart = Date.now();
            setTimeout(function(){
                var boot = document.getElementById('sertex-boot');
                var root = document.getElementById('root');
                // If boot loader is still present AND no React children rendered, show error
                if (boot && root && root.children.length === 1 && root.firstElementChild === boot) {
                    var err = document.getElementById('sertex-error');
                    var msg = document.getElementById('sertex-error-msg');
                    if (msg) msg.textContent = 'JS bundle yüklendi ama React uygulama başlamadı. URL: ' + window.location.href;
                    if (err) err.classList.add('show');
                }
            }, 15000);
            // Global error handler → show visible error instead of white screen
            window.addEventListener('error', function(e){
                if (e && e.error && !(e.error instanceof DOMException)) {
                    var err = document.getElementById('sertex-error');
                    var msg = document.getElementById('sertex-error-msg');
                    if (msg) msg.textContent = String(e.message || e.error);
                    if (err) err.classList.add('show');
                }
            });
        </script>
